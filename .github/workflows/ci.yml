name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate styles and orionctl
        run: make check
      - name: ShellCheck
        run: shellcheck scripts/collect-info.sh packaging/udev/orion-unchained-permissions

  driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install headers for the runner's kernel
        run: sudo apt-get update && sudo apt-get install -y linux-headers-$(uname -r)
      - name: Build the kernel module
        run: make module
